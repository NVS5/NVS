<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Smart</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1c23">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --alert-color: #ef4444;
      --success-color: #10b981;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #2563eb;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .water-tank {
      height: 120px;
      border: 2px solid var(--accent-color);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .water-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: var(--accent-color);
      opacity: 0.6;
      transition: height 0.5s ease-in-out;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .btn-off {
      background-color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nova Smart 🏠</h1>
    <button id="themeToggle" class="btn" style="width: auto;">تغيير المظهر</button>
  </header>

  <!-- قسم مستوى المياه -->
  <div class="card">
    <h3>مستوى المياه 💧</h3>
    <div class="water-tank">
      <div id="waterFill" class="water-fill" style="height: 0%;"></div>
      <span id="waterText" style="position: relative; z-index: 2; font-weight: bold;">0%</span>
    </div>
  </div>

  <!-- قسم الإشعارات الأخيرة -->
  <div class="card">
    <h3>آخر التنبيهات 🔔</h3>
    <p id="alertBox">لا توجد تنبيهات حالية</p>
  </div>

  <!-- قسم التحكم بالوحدات -->
  <div class="card">
    <h3>وحدات التحكم ⚡</h3>
    <div class="controls-grid">
      <button id="pumpBtn" class="btn btn-off" onclick="toggleSwitch('Controls/Pump/status', this)">مضخة المياه</button>
      <button id="heaterBtn" class="btn btn-off" onclick="toggleSwitch('Controls/Heater/status', this)">السخان</button>
      <button id="lamp1Btn" class="btn btn-off" onclick="toggleSwitch('Controls/Lamp1/status', this)">اللمبة 1</button>
      <button id="lamp2Btn" class="btn btn-off" onclick="toggleSwitch('Controls/Lamp2/status', this)">اللمبة 2</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDy18HXJDYsLqlgCcbnuBBa1a_av9-FyoE",
      databaseURL: "https://smarthome-ad84f-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. طلب إذن الإشعارات
    if ("Notification" in window) {
      if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }

    function sendLocalNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: "https://cdn-icons-png.flaticon.com/512/25/25694.png"
        });
      }
    }

    // 2. الاستماع لمستوى المياه
    const waterFill = document.getElementById("waterFill");
    const waterText = document.getElementById("waterText");

    onValue(ref(db, "waterLevel"), (snapshot) => {
      const level = snapshot.val() || 0;
      waterFill.style.height = level + "%";
      waterText.innerText = level + "%";
    });

    // 3. الاستماع للتنبيهات القادمة من NodeMCU
    let lastAlertText = "";
    onValue(ref(db, "notifications/lastAlert"), (snapshot) => {
      const alertMsg = snapshot.val();
      if (alertMsg && alertMsg !== lastAlertText) {
        lastAlertText = alertMsg;
        document.getElementById("alertBox").innerText = alertMsg;
        sendLocalNotification("Nova Smart", alertMsg);
      }
    });

    // 4. التحكم بالمفاتيح
    window.toggleSwitch = function(path, element) {
      const currentStatus = element.classList.contains("btn-off") ? 1 : 0;
      set(ref(db, path), currentStatus);
    };

    function bindButton(path, elementId) {
      const btn = document.getElementById(elementId);
      onValue(ref(db, path), (snapshot) => {
        const val = snapshot.val();
        if (val === 1) {
          btn.classList.remove("btn-off");
        } else {
          btn.classList.add("btn-off");
        }
      });
    }

    bindButton("Controls/Pump/status", "pumpBtn");
    bindButton("Controls/Heater/status", "heaterBtn");
    bindButton("Controls/Lamp1/status", "lamp1Btn");
    bindButton("Controls/Lamp2/status", "lamp2Btn");

    // 5. تبديل المظهر (Dark/Light Mode)
    document.getElementById("themeToggle").addEventListener("click", () => {
      const currentTheme = document.body.getAttribute("data-theme");
      if (currentTheme === "light") {
        document.body.removeAttribute("data-theme");
      } else {
        document.body.setAttribute("data-theme", "light");
      }
    });

    // 6. تسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker Registration Failed!', err));
      });
    }
  </script>
</body>
</html>
