<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Smart</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nova Smart" />
  <link rel="apple-touch-icon" href="logo.png" />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      /* Default Light Theme */
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #94a3b8;
      --accent-blue: #2563eb;
      --accent-green: #059669;
      --accent-red: #dc2626;
      --accent-amber: #d97706;
      --accent-purple: #7c3aed;
      --box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      /* Dark Theme */
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #222d45;
      --text-main: #ffffff;
      --text-sub: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-purple: #8b5cf6;
      --box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      transition: background-color 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s, transform 0.1s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .logo:active {
      transform: scale(0.9);
    }

    header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .theme-btn, .lang-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--box-shadow);
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: 10px;
    }

    /* Top Grid: Water Tank & Temp */
    .top-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card-stat {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--box-shadow);
    }

    .tank-box {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 90px;
    }

    .tank-container {
      position: relative;
      width: 50px;
      height: 80px;
      border: 2px solid var(--accent-blue);
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.05);
      overflow: hidden;
    }

    .tank-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
      border-radius: 0 0 4px 4px;
      transition: height 0.5s ease;
    }

    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      bottom: 0;
      animation: rise 3s infinite ease-in;
    }
    .b1 { width: 4px; height: 4px; left: 30%; animation-duration: 2.5s; }
    .b2 { width: 6px; height: 6px; left: 60%; animation-duration: 3.2s; animation-delay: 0.5s; }

    @keyframes rise {
      0% { bottom: -5px; opacity: 0; }
      50% { opacity: 0.8; }
      100% { bottom: 100%; opacity: 0; }
    }

    .tank-details h3 {
      font-size: 22px;
      font-weight: 800;
    }

    .tank-details p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .temp-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 90px;
    }

    .temp-val {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-red);
    }

    .temp-lbl {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* Dual Power Source Grid */
    .power-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .power-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--box-shadow);
      opacity: 0.5;
      transform: scale(0.98);
      position: relative;
    }

    .power-card .power-icon {
      font-size: 20px;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .power-card .power-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .power-card .power-status {
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
      color: var(--text-sub);
    }

    /* Active Power Card Style */
    .power-card.active {
      opacity: 1;
      transform: scale(1);
      border-color: var(--accent-green);
      background: linear-gradient(135deg, var(--card-bg) 0%, rgba(16, 185, 129, 0.08) 100%);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .power-card.active .power-icon {
      color: var(--accent-green);
    }

    .power-card.active .power-status {
      color: var(--accent-green);
      font-weight: 800;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .control-window {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      box-shadow: var(--box-shadow);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      position: relative;
    }

    .control-window:active {
      transform: scale(0.97);
    }

    /* Active States */
    .control-window.on {
      border-color: var(--accent-blue);
      background: linear-gradient(135deg, var(--card-bg) 0%, rgba(59, 130, 246, 0.08) 100%);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }

    .control-window.auto {
      border-color: var(--accent-amber);
      background: linear-gradient(135deg, var(--card-bg) 0%, rgba(245, 158, 11, 0.08) 100%);
    }

    .control-window.timer-locked {
      border-color: var(--accent-purple) !important;
      background: linear-gradient(135deg, var(--card-bg) 0%, rgba(139, 92, 246, 0.1) 100%) !important;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .window-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-icon {
      font-size: 20px;
      color: var(--text-sub);
    }

    .control-window.on .window-icon { color: var(--accent-blue); }
    .control-window.auto .window-icon { color: var(--accent-amber); }
    .control-window.timer-locked .window-icon { color: var(--accent-purple); }

    .status-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.dark-mode .status-tag {
      background: rgba(255, 255, 255, 0.05);
    }

    .control-window.on .status-tag {
      color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.15);
    }

    .control-window.auto .status-tag {
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.15);
    }

    .control-window.timer-locked .status-tag {
      color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.15);
    }

    .window-title {
      font-size: 13px;
      font-weight: 700;
    }

    /* Timer Icon */
    .timer-icon {
      font-size: 14px;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.3s ease;
      padding: 4px;
    }
    .timer-icon:hover { color: var(--accent-blue); }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }

    .timer-active {
      animation: shake 0.5s infinite;
      color: var(--accent-amber) !important;
    }

    /* LED Indicator */
    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: none;
    }
    .status-led.show { display: inline-block; }
    .status-led.green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .status-led.black { background: #000; }

    /* Popups */
    #timer-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 20px;
      z-index: 9999;
      color: var(--text-main);
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    #timer-popup h3 { font-size: 16px; margin-bottom: 12px; text-align: center; font-weight: 800; }
    #timer-popup label { display: block; margin-top: 10px; font-size: 12px; color: var(--text-sub); font-weight: 700; }
    #timer-popup input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--bg-color);
      color: var(--text-main);
      outline: none;
    }

    #timer-popup button {
      margin-top: 14px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      width: 48%;
    }

    #set-timer-btn { background-color: var(--accent-blue); }
    #cancel-timer-btn { background-color: var(--text-sub); }
    #clear-timer-btn { background-color: var(--accent-red); width: 100% !important; margin-top: 10px; }

    /* Remote Popup */
    #remote-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 99999;
      overflow: auto;
    }

    .remote {
      width: 280px;
      background: #0f0f0f;
      border-radius: 30px;
      padding: 16px 14px 22px;
      margin: 40px auto;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .row.two { grid-template-columns: repeat(2, 1fr); }
    .btn { background: #2b2b2b; border: none; border-radius: 12px; padding: 12px 0; color: #fff; font-size: 14px; cursor: pointer; }
    .btn:active { background: #555; }
    .red { background: #c0392b; }
    .green { background: #27ae60; }
    .yellow { background: #f1c40f; color: #000; }
    .blue { background: #2980b9; }

    .nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .ok { background: #444; font-weight: bold; }
    .numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .extra-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .extra-keys .btn { padding: 14px 0; font-size: 13px; border-radius: 14px; }

    .close-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
    }
    html[dir="rtl"] .close-btn {
      right: auto;
      left: 16px;
    }

    /* Loading & Login Screens */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999999;
      transition: opacity 0.5s ease;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid var(--card-border);
      border-top: 4px solid var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text { margin-top: 15px; font-size: 14px; color: var(--text-sub); font-weight: 600; }

    #login-popup {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 360px;
      box-shadow: var(--box-shadow);
      text-align: center;
    }

    .login-box h2 { margin-bottom: 20px; font-size: 20px; color: var(--accent-blue); font-weight: 800; }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--bg-color);
      color: var(--text-main);
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent-blue);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }

    .login-box .error-msg {
      color: var(--accent-red);
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text" data-i18n="connecting">Connecting...</div>
  </div>

  <!-- Login Popup -->
  <div id="login-popup" style="display: none;">
    <div class="login-box">
      <h2 data-i18n="loginTitle">Control Panel Login</h2>
      <input type="email" id="login-email" placeholder="Email" data-i18n-ph="emailPh" required />
      <input type="password" id="login-password" placeholder="Password" data-i18n-ph="passPh" required />
      <button id="login-btn" data-i18n="loginBtn">Login</button>
      <div class="error-msg" id="login-error" data-i18n="loginErr">Login failed! Please check your credentials.</div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <header>
      <div class="header-brand">
        <img src="logo.png" alt="Logo" class="logo" id="logo-btn" title="Logout" />
        <h1>Nova Smart</h1>
      </div>
      <div class="header-controls">
        <button class="lang-btn" id="langBtn">العربية</button>
        <button class="theme-btn" id="themeBtn">🌙 Dark</button>
      </div>
    </header>

    <!-- Sensors Section -->
    <div class="top-grid">
      <div class="card-stat">
        <div class="tank-box">
          <div class="tank-container">
            <div id="water-bar" class="tank-fill">
              <div class="bubble b1"></div>
              <div class="bubble b2"></div>
            </div>
          </div>
          <div class="tank-details">
            <h3 id="water-value">0%</h3>
            <p data-i18n="waterLevel">Water Level</p>
          </div>
        </div>
      </div>

      <div class="card-stat">
        <div class="temp-box">
          <span class="temp-val" id="temperature-value">0°C</span>
          <span class="temp-lbl" data-i18n="temperature">Temperature</span>
        </div>
      </div>
    </div>

    <!-- Grid Power Source Section (2 Cards) -->
    <div class="section-title" data-i18n="secPower">Grid Power Source</div>
    <div class="power-grid">
      <div class="power-card" id="pwr-grid">
        <i class="fa-solid fa-building-columns power-icon"></i>
        <span class="power-name" data-i18n="pwrGrid">Grid Power</span>
        <span class="power-status" id="pwr-grid-status" data-i18n="off">OFF</span>
      </div>
      <div class="power-card" id="pwr-generator">
        <i class="fa-solid fa-plug-circle-bolt power-icon"></i>
        <span class="power-name" data-i18n="pwrGenerator">Generator</span>
        <span class="power-status" id="pwr-generator-status" data-i18n="off">OFF</span>
      </div>
    </div>

    <!-- Controls Grid Section -->
    <div class="section-title" data-i18n="secControls">Controls</div>
    <div class="controls-grid">

      <!-- Water Pump -->
      <div class="control-window" id="waterpump-card">
        <div class="window-top">
          <i class="fa-solid fa-faucet-drip window-icon"></i>
          <span class="status-tag">
            <span class="status-led"></span>
            <span class="status-text">OFF</span>
          </span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="window-title" data-i18n="waterPump">Water Pump</div>
          <i class="fa-solid fa-clock timer-icon" title="Set Timer" data-device="waterpump"></i>
        </div>
      </div>

      <!-- Heater -->
      <div class="control-window" id="heater-card">
        <div class="window-top">
          <i class="fa-solid fa-temperature-arrow-up window-icon"></i>
          <span class="status-tag">
            <span class="status-led"></span>
            <span class="status-text">OFF</span>
          </span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="window-title" data-i18n="heater">Heater</div>
          <i class="fa-solid fa-clock timer-icon" title="Set Timer" data-device="heater"></i>
        </div>
      </div>

      <!-- Lamp 1 -->
      <div class="control-window" id="lamp1-card">
        <div class="window-top">
          <i class="fa-solid fa-lightbulb window-icon"></i>
          <span class="status-tag">
            <span class="status-led"></span>
            <span class="status-text">OFF</span>
          </span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="window-title" data-i18n="lamp1">Lamp 1</div>
          <i class="fa-solid fa-clock timer-icon" title="Set Timer" data-device="lamp1"></i>
        </div>
      </div>

      <!-- Lamp 2 -->
      <div class="control-window" id="lamp2-card">
        <div class="window-top">
          <i class="fa-solid fa-lightbulb window-icon"></i>
          <span class="status-tag">
            <span class="status-led"></span>
            <span class="status-text">OFF</span>
          </span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="window-title" data-i18n="lamp2">Lamp 2</div>
          <i class="fa-solid fa-clock timer-icon" title="Set Timer" data-device="lamp2"></i>
        </div>
      </div>

      <!-- Remote Control Card -->
      <div class="control-window" id="remote-card" style="grid-column: span 2;">
        <div class="window-top">
          <i class="fa-solid fa-tv window-icon"></i>
          <span class="status-tag">IR</span>
        </div>
        <div class="window-title" data-i18n="tvRemote">TV / Receiver Remote</div>
      </div>

    </div>
  </div>

  <!-- Remote Popup -->
  <div id="remote-popup">  
    <button class="close-btn" onclick="closeRemote()" data-i18n="closeBtn">✖ Close</button>  
    <div class="remote">    
      <div class="row two">  
        <button class="btn red" onclick="sendCmd('0x23DC', '0xFD01')">🔆</button>  
        <button class="btn" onclick="sendCmd('0x8B', '0xFD01')">🔇</button>  
      </div>    
      <div class="row">  
        <button class="btn" onclick="sendCmd('0xC9', '0xFD01')">&#x23EF;</button>  
        <button class="btn" onclick="sendCmd('0xC8', '0xFD01')">USB</button>  
        <button class="btn" onclick="sendCmd('0x99', '0xFD01')">&#x25CF;</button>  
        <button class="btn" onclick="sendCmd('0xCD', '0xFD01')">INFO</button>  
      </div>    
      <div class="row">  
        <button class="btn red" onclick="sendCmd('0xC7', '0xFD01')">|&#x25C0;&#x25C0;</button>  
        <button class="btn green" onclick="sendCmd('0xC6', '0xFD01')">&#x25B6;&#x25B6;|</button>  
        <button class="btn yellow" onclick="sendCmd('0xC5', '0xFD01')">&#x25C0;&#x25C0;</button>  
        <button class="btn blue" onclick="sendCmd('0xC4', '0xFD01')">&#x25B6;&#x25B6;</button>  
      </div>

      <div class="extra-keys">  
        <button class="btn" onclick="sendCmd('0x9D', '0xFD01')">SUBTITLE</button>  
        <button class="btn" onclick="sendCmd('0xDD', '0xFD01')">RECALL</button>  
        <button class="btn green" onclick="sendCmd('0x83', '0xFD01')">PAGE +</button>    
        <button class="btn" onclick="sendCmd('0xCE', '0xFD01')">TXT</button>

      <div class="numbers">  
        <button class="btn" onclick="sendCmd('0x8E', '0xFD01')">1</button>  
        <button class="btn" onclick="sendCmd('0x86', '0xFD01')">2</button>  
        <button class="btn" onclick="sendCmd('0x8F', '0xFD01')">3</button>  
        <button class="btn" onclick="sendCmd('0x92', '0xFD01')">4</button>  
        <button class="btn" onclick="sendCmd('0x87', '0xFD01')">5</button>  
        <button class="btn" onclick="sendCmd('0x93', '0xFD01')">6</button>  
        <button class="btn" onclick="sendCmd('0x96', '0xFD01')">7</button>  
        <button class="btn" onclick="sendCmd('0x82', '0xFD01')">8</button>  
        <button class="btn" onclick="sendCmd('0x97', '0xFD01')">9</button>  
        <button class="btn" onclick="sendCmd('0x9A', '0xFD01')">0</button>  
        <button class="btn" onclick="sendCmd('0xDF', '0xFD01')">EPG</button>

  <!-- Timer Popup -->
  <div id="timer-popup">  
    <h3 id="timer-popup-title">Device Timer Setup</h3>  
    <label for="start-time" data-i18n="startTime">Start Time:</label>  
    <input type="datetime-local" id="start-time" />  
    <label for="end-time" data-i18n="endTime">End Time:</label>  
    <input type="datetime-local" id="end-time" />  
    <div style="display:flex; justify-content: space-between; flex-wrap: wrap; margin-top: 10px;">  
      <button id="set-timer-btn" data-i18n="setBtn">Set</button>  
      <button id="cancel-timer-btn" data-i18n="cancelBtn">Cancel</button>  
      <button id="clear-timer-btn" data-i18n="clearBtn">Clear Timer</button>  
    </div>  
  </div>

<!-- Firebase & App Script -->
<script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";  
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";  
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  
    // 1. إعدادات السنترال فايربيس الخاصة بك (Nova User Central)
    const centralFirebaseConfig = {  
      apiKey: "AIzaSyACJo8eozzBeUIQ45KBUSVpTtzZ_Vac2Mo",
      authDomain: "novauser-ee332.firebaseapp.com",
      databaseURL: "https://novauser-ee332-default-rtdb.firebaseio.com",
      projectId: "novauser-ee332",
      storageBucket: "novauser-ee332.firebasestorage.app",
      messagingSenderId: "170384580105",
      appId: "1:170384580105:web:6384592f92e43c2af322d8",
      measurementId: "G-Z26D2YL849"
    };  
  
    // تهيئة مشروع السنترال فايربيس
    const centralApp = initializeApp(centralFirebaseConfig, "centralApp");  
    const centralDb = getDatabase(centralApp);  

    // متغيرات الفايربيس الديناميكية للعميل
    let clientApp = null;
    let database = null;
    let auth = null;

    // --- LocalStorage Read ---
    let savedLang = localStorage.getItem('nova_lang') || 'en';
    let savedTheme = localStorage.getItem('nova_theme') || 'light';

    // القاموس للترجمة
    const translations = {
      en: {
        connecting: "Connecting...",
        loginTitle: "Control Panel Login",
        emailPh: "Email",
        passPh: "Password",
        loginBtn: "Login",
        loginErr: "Login failed! Please check your credentials.",
        waterLevel: "Water Level",
        temperature: "Temperature",
        secPower: "Power Source",
        pwrGrid: "Grid Power",
        pwrGenerator: "Generator",
        on: "ACTIVE",
        off: "OFF",
        secControls: "Controls",
        waterPump: "Water Pump",
        heater: "Heater",
        lamp1: "Lamp 1",
        lamp2: "Lamp 2",
        tvRemote: "TV / Receiver Remote",
        closeBtn: "✖ Close",
        startTime: "Start Time:",
        endTime: "End Time:",
        setBtn: "Set",
        cancelBtn: "Cancel",
        clearBtn: "Clear Timer",
        autoState: "AUTO",
        timerState: "TIMER",
        lostConn: "Connection lost! Reconnecting...",
        verifying: "Verifying credentials...",
        timerTitlePrefix: "Set Timer for "
      },
      ar: {
        connecting: "جاري الاتصال...",
        loginTitle: "تسجيل دخول لوحة التحكم",
        emailPh: "البريد الإلكتروني",
        passPh: "كلمة المرور",
        loginBtn: "تسجيل الدخول",
        loginErr: "فشل تسجيل الدخول! يرجى التحقق من صحة البيانات.",
        waterLevel: "مستوى المياه",
        temperature: "درجة الحرارة",
        secPower: "مصدر الكهرباء",
        pwrGrid: "كهرباء دولة",
        pwrGenerator: "اشتراك",
        on: "موصول",
        off: "مقطوع",
        secControls: "وحدات التحكم",
        waterPump: "موتير المياه",
        heater: "السخان",
        lamp1: "اللمبة 1",
        lamp2: "اللمبة 2",
        tvRemote: "ريموت التلفزيون / الرسيفر",
        closeBtn: "✖ إغلاق",
        startTime: "البداية:",
        endTime: "النهاية:",
        setBtn: "ضبط",
        cancelBtn: "إلغاء",
        clearBtn: "مسح المؤقت",
        autoState: "تلقائي",
        timerState: "مؤقت",
        lostConn: "فُقد الاتصال! جاري إعادة التشغيل...",
        verifying: "جاري التحقق من الصلاحيات...",
        timerTitlePrefix: "ضبط مؤقت جهاز "
      }
    };

    let currentLang = savedLang;
    let lastPowerValue = null;

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('nova_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (translations[lang][key]) {
          el.placeholder = translations[lang][key];
        }
      });

      document.getElementById('langBtn').textContent = lang === 'en' ? 'العربية' : 'English';
      
      if (lastPowerValue !== null && typeof window.updatePowerUI === 'function') {
        window.updatePowerUI(lastPowerValue);
      }
    }

    function setTheme(theme) {
      const themeBtn = document.getElementById('themeBtn');
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️ Light';
        localStorage.setItem('nova_theme', 'dark');
      } else {
        document.body.classList.remove('dark-mode');
        themeBtn.textContent = '🌙 Dark';
        localStorage.setItem('nova_theme', 'light');
      }
    }

    setLanguage(savedLang);
    setTheme(savedTheme);

    document.getElementById('themeBtn').addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark-mode');
      setTheme(isDark ? 'light' : 'dark');
    });

    document.getElementById('langBtn').addEventListener('click', () => {
      const newLang = currentLang === 'en' ? 'ar' : 'en';
      setLanguage(newLang);
    });

    // --- وظيفة تسجيل الخروج عند الضغط على اللوجو ---
    document.getElementById('logo-btn').addEventListener('click', () => {
      localStorage.removeItem("nova_client_config");
      localStorage.removeItem("nova_client_email");
      if (auth) {
        signOut(auth).then(() => {
          window.location.reload();
        }).catch(() => {
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    });
  
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Registered successfully.'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    const loadingScreen = document.getElementById("loading-screen");
    const loginPopup = document.getElementById("login-popup");
    let pageReady = false;
    let disconnectTimer = null; 

    function hideLoading() {
      if (pageReady) return;
      pageReady = true;
      loadingScreen.style.opacity = "0";
      setTimeout(() => { loadingScreen.style.display = "none"; }, 500);
    }

    // --- فحص وجود بيانات العميل المحفوظة تلقائياً للتسجيل التلقائي ---
    window.addEventListener("DOMContentLoaded", () => {
      const savedClientConfig = localStorage.getItem("nova_client_config");
      const savedEmail = localStorage.getItem("nova_client_email");

      if (savedClientConfig && savedEmail) {
        initClientApp(JSON.parse(savedClientConfig));
      } else {
        loadingScreen.style.display = "none";
        loginPopup.style.display = "flex";
      }
    });

    // --- عملية تسجيل الدخول عند ضغط الزر ---
    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errorMsg = document.getElementById("login-error");

      if (!email || !password) return;

      loadingScreen.style.display = "flex";
      loadingScreen.style.opacity = "1";
      document.querySelector(".loading-text").innerText = translations[currentLang].verifying;

      try {
        const sanitizedEmailKey = email.replace(/\./g, "_");
        
        const userConfigRef = ref(centralDb, `users/${sanitizedEmailKey}`);
        const snapshot = await get(userConfigRef);

        if (!snapshot.exists()) {
          throw new Error("No configuration found for this email");
        }

        const clientConfig = snapshot.val();

        localStorage.setItem("nova_client_config", JSON.stringify(clientConfig));
        localStorage.setItem("nova_client_email", email);

        initClientApp(clientConfig, email, password);

      } catch (error) {
        loadingScreen.style.display = "none";
        errorMsg.style.display = "block";
        errorMsg.innerText = `${translations[currentLang].loginErr}`;
      }
    });

    // --- تهيئة فايربيس العميل والاتصال بقاعدة بياناته ---
    function initClientApp(config, email = null, password = null) {
      if (!clientApp) {
        clientApp = initializeApp(config, "clientApp");
        database = getDatabase(clientApp);
        auth = getAuth(clientApp);
      }

      setPersistence(auth, browserLocalPersistence).then(() => {
        onAuthStateChanged(auth, (user) => {
          if (user) {
            loginPopup.style.display = "none";
            onValue(ref(database, ".info/connected"), (snap) => {
              if (snap.val() === true) {
                if (disconnectTimer) {
                  clearTimeout(disconnectTimer);
                  disconnectTimer = null;
                }
                setTimeout(hideLoading, 1000);
              } else {
                if (pageReady && !disconnectTimer) {
                  disconnectTimer = setTimeout(() => {
                    loadingScreen.style.display = "flex";
                    loadingScreen.style.opacity = "1";
                    document.querySelector(".loading-text").innerText = translations[currentLang].lostConn;
                    setTimeout(() => { window.location.reload(); }, 500);
                  }, 4000); 
                }
              }
            });
            initSmartHomeApp();
          } else {
            if (email && password) {
              signInWithEmailAndPassword(auth, email, password)
                .catch((err) => {
                  localStorage.removeItem("nova_client_config");
                  localStorage.removeItem("nova_client_email");
                  loadingScreen.style.display = "none";
                  document.getElementById("login-error").style.display = "block";
                });
            } else {
              loadingScreen.style.display = "none";
              loginPopup.style.display = "flex";
            }
          }
        });
      });
    }

    function initSmartHomeApp() {
      // Remote Setup
      const remotePopup = document.getElementById("remote-popup");  
      const remoteCard  = document.getElementById("remote-card");  
    
      remoteCard.addEventListener("click", () => { remotePopup.style.display = "block"; });  
      window.closeRemote = function () { remotePopup.style.display = "none"; };  

      window.sendCmd = function (command, address) {  
        const remoteRef = ref(database, "Remote");  
        set(remoteRef, { command: command, address: address });  
      };  
    
      // Toggles Setup
      const toggles = [  
        { path: "output/devices/waterpump", id: "waterpump" },  
        { path: "output/devices/heater", id: "heater" },  
        { path: "output/devices/lamp1", id: "lamp1" },  
        { path: "output/devices/lamp2", id: "lamp2" }
      ];  
    
      let localDeviceStates = {};

      toggles.forEach((toggle) => {  
        const card = document.getElementById(`${toggle.id}-card`);  
        const dbRef = ref(database, toggle.path);  
        const timerRef = ref(database, `timers/${toggle.id}`);

        onValue(timerRef, (snap) => {
          const timerIcon = card.querySelector(".timer-icon");
          if (snap.exists() && snap.val() !== null) {
            timerIcon.classList.add("timer-active");
          } else {
            timerIcon.classList.remove("timer-active");
          }
        });

        onValue(dbRef, (snap) => {  
          const val = snap.val() ?? 0;
          localDeviceStates[toggle.id] = val;

          card.classList.remove("on", "auto", "timer-locked");
          const led = card.querySelector(".status-led");
          const statusText = card.querySelector(".status-text");
          if (led) { led.classList.remove("show", "green", "black"); }

          if (val === 1) {
            card.classList.add("on");
            if (statusText) statusText.innerText = "ON";
          } else if (val === 2) {
            card.classList.add("auto");
            if (statusText) statusText.innerText = translations[currentLang].autoState;
            if (led) { led.classList.add("show", "black"); }
          } else if (val === 3) {
            card.classList.add("auto");
            if (statusText) statusText.innerText = translations[currentLang].autoState;
            if (led) { led.classList.add("show", "green"); }
          } else if (val === 4) {
            card.classList.add("timer-locked");
            if (statusText) statusText.innerText = translations[currentLang].timerState;
          } else {
            if (statusText) statusText.innerText = "OFF";
          }
        });

        let pressTimer = null;
        let isLongPress = false;

        card.addEventListener("pointerdown", (e) => {
          if (localDeviceStates[toggle.id] === 4) return; 
          if (e.target.classList.contains("timer-icon")) return;
          
          isLongPress = false;
          if (pressTimer) clearTimeout(pressTimer);

          pressTimer = setTimeout(() => {
            isLongPress = true;
            let current = localDeviceStates[toggle.id] ?? 0;
            let targetState = (current === 1) ? 3 : 2;

            set(dbRef, targetState);
            if (navigator.vibrate) navigator.vibrate(60); 
          }, 700); 
        });

        card.addEventListener("pointerup", (e) => {
          if (localDeviceStates[toggle.id] === 4) return;
          if (e.target.classList.contains("timer-icon")) return;
          
          clearTimeout(pressTimer); 

          if (!isLongPress) {
            let current = localDeviceStates[toggle.id] ?? 0;
            let newState = 0;

            if (current === 0) newState = 1;
            else if (current === 1) newState = 0;
            else if (current === 2 || current === 3) newState = 0;

            set(dbRef, newState);
          }
        });

        card.addEventListener("pointercancel", () => {
          clearTimeout(pressTimer);
        });
      });  

      // Sensors updates
      onValue(ref(database, "temperature"), (snap) => {  
        const temp = snap.val() || 0;  
        document.getElementById("temperature-value").innerText = `${temp}°C`;  
      });  
    
      onValue(ref(database, "waterLevel"), (snap) => {  
        const level = snap.val() || 0;  
        document.getElementById("water-bar").style.height = `${level}%`;  
        document.getElementById("water-value").innerText = `${level}%`;  
      });  
    
      // Dual Power State Handler
      const pwrGrid = document.getElementById("pwr-grid");
      const pwrGenerator = document.getElementById("pwr-generator");

      const pwrGridStat = document.getElementById("pwr-grid-status");
      const pwrGenStat = document.getElementById("pwr-generator-status");

      window.updatePowerUI = function(val) {
        lastPowerValue = val;
        
        pwrGrid.className = "power-card";
        pwrGenerator.className = "power-card";

        pwrGridStat.innerText = translations[currentLang].off;
        pwrGenStat.innerText = translations[currentLang].off;

        if (val === 1) {
          pwrGrid.classList.add("active");
          pwrGridStat.innerText = translations[currentLang].on;
        } else if (val === 2) {
          pwrGenerator.classList.add("active");
          pwrGenStat.innerText = translations[currentLang].on;
        }
      };

      onValue(ref(database, "output/devices/kahrba"), (snap) => {  
        updatePowerUI(snap.val());  
      });  
    
      // Timers logic
      const popup = document.getElementById("timer-popup");  
      const startInput = document.getElementById("start-time");  
      const endInput = document.getElementById("end-time");  
      const setTimerBtn = document.getElementById("set-timer-btn");  
      const cancelTimerBtn = document.getElementById("cancel-timer-btn");  
      const clearTimerBtn = document.getElementById("clear-timer-btn");  
    
      let currentDevice = null;  
    
      function msToLocalDatetime(ms) {  
        if (!ms) return "";  
        const date = new Date(ms);  
        const year = date.getFullYear();  
        const month = String(date.getMonth() + 1).padStart(2, "0");  
        const day = String(date.getDate()).padStart(2, "0");  
        const hours = String(date.getHours()).padStart(2, "0");  
        const minutes = String(date.getMinutes()).padStart(2, "0");  
        return `${year}-${month}-${day}T${hours}:${minutes}`;  
      }  
    
      function datetimeLocalToMs(localStr) {  
        if (!localStr) return null;  
        const [datePart, timePart] = localStr.split("T");  
        const [year, month, day] = datePart.split("-").map(Number);  
        const [hour, minute] = timePart.split(":").map(Number);  
        return new Date(year, month - 1, day, hour, minute).getTime();  
      }  
    
      document.querySelectorAll(".timer-icon").forEach(icon => {  
        icon.addEventListener("click", (e) => {  
          e.stopPropagation();  
          currentDevice = icon.getAttribute("data-device");  
          popup.style.display = "block";  
          document.getElementById("timer-popup-title").textContent = `${translations[currentLang].timerTitlePrefix}${currentDevice}`;  
    
          const timerRef = ref(database, `timers/${currentDevice}`);  
          onValue(timerRef, (snap) => {  
            const data = snap.val();  
            startInput.value = data?.start ? msToLocalDatetime(data.start) : "";  
            endInput.value = data?.end ? msToLocalDatetime(data.end) : "";  
          }, { onlyOnce: true });  
        });  
      });  
    
      setTimerBtn.addEventListener("click", () => {  
        if (!currentDevice) return;  
        const startMs = datetimeLocalToMs(startInput.value);  
        const endMs = datetimeLocalToMs(endInput.value);  
        if (!startMs || !endMs || startMs >= endMs) {  
          popup.style.display = "none";  
          currentDevice = null;  
          return;  
        }  
        const timerRef = ref(database, `timers/${currentDevice}`);  
        set(timerRef, { start: startMs, end: endMs }).then(() => {  
          popup.style.display = "none";  
          currentDevice = null;  
        });  
      });  
    
      cancelTimerBtn.addEventListener("click", () => {  
        popup.style.display = "none";  
        currentDevice = null;  
      });  
    
      clearTimerBtn.addEventListener("click", () => {  
        if (!currentDevice) return;  
        const timerRef = ref(database, `timers/${currentDevice}`);  
        set(timerRef, null).then(() => {  
          popup.style.display = "none";  
          currentDevice = null;  
        });  
      });  
    }
</script>
